[project]
name = "honcho-memory-agent"
version = "0.1.0"
description = "Always-on memory agent backed by Honcho"
requires-python = ">=3.11"
dependencies = [
    "honcho-ai>=2.0.0",
    "aiohttp>=3.9.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
